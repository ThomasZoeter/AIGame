<button (click)="goToAddEntity()">Add entity:</button>
<div class="card my-5">
    <div class="card-body">
        <table>
            <thead>
            <th>ID</th>
            <th>Number</th>
            <th>Actions</th>
            </thead>
            <tbody>

                @for (num of numbers();let idx = $index;track idx) {
                    <tr>
                        <td>{{ num.id }}</td>
                        <td>{{ num.number }}</td>
                        <td>
                            <button (click)="deleteNumber(num.id)"> Delete</button>
                        </td>
                    </tr>
                }

            </tbody>
        </table>

    </div>
</div>
