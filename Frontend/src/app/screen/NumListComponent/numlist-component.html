<button (click)="goToAddEntity()">Add entity:</button>
<div class="card my-5">
    <div class="card-body">
        <div>
            @for (num of numbers();let idx = $index;track idx) {
                <div class="numberEntity">
                    <td>ID: {{ num.id }}</td>
                    <td>, Number: {{ num.number }}</td>
                    <td>
                        <button (click)="deleteNumber(num.id)"> Delete</button>
                    </td>
                </div>
            }
        </div>

    </div>
</div>
