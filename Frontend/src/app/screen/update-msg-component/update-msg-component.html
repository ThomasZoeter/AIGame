<div class="row">
    <div class="card col-md-6 offset-md-3 offset-md-3">
            <h3 class="text-center"> Update Message </h3>
            <div class="card-body">
                <form (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label>Message</label>
                        <input type="text" class="form-control" id="Message" [(ngModel)]="message.message"
                               name="Message">
                    </div>
                    <button class="btn btn-success" type="submit">Submit</button>

                </form>
        </div>
    </div>
</div>
