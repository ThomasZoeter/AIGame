<div class="row">
    <div class="card col-md-6 offset-md-3 offset-md-3">
            <h3 class="text-center"> Update number </h3>
            <div class="card-body">
                <form (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label>Number</label>
                        <input type="text" class="form-control" id="number" [(ngModel)]="number.number"
                               name="number">
                    </div>
                    <button class="btn btn-success" type="submit">Submit</button>

                </form>
        </div>
    </div>
</div>
